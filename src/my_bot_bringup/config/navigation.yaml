amcl:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    max_particles: 2000
    min_particles: 500

    # Mo hinh nhieu odometry. Mac dinh Nav2 la 0.2 cho ca bon, tuc gia dinh
    # odometry sai toi 20%. Xe nay DA DO:
    #   goc     ~1%  (tools/check_lidar_angle.py, doi chieu anh quet qua 683 do:
    #                 quaternion -1.01, gyro -0.99)
    #   quang duong ~2% sau hieu chinh (ba lan chay 2.00 m: 1.967/1.953/1.978)
    # Gia dinh qua long lam dam hat tan rong va vi tri uoc luong rung. 0.1 van
    # chua bien 5-10 lan sai so do duoc, phong banh truot tren gach bong.
    #   alpha1: nhieu GOC do QUAY    alpha2: nhieu GOC do TINH TIEN
    #   alpha3: nhieu TINH TIEN do TINH TIEN   alpha4: nhieu TINH TIEN do QUAY
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1

    # AMCL chi chay mot buoc loc sau khi xe di bay nhieu. Mac dinh 0.25 m / 0.2
    # rad - o 0.25 m/s la mot giay moi sua mot lan, qua thua cho phong 6x5 m va
    # xe 18 cm.
    update_min_d: 0.1
    update_min_a: 0.1

    # Vi tri ban dau AMCL tu dat khi khoi dong, khoi phai bam "2D Pose Estimate".
    #   Gazebo : xe luon spawn o goc (gazebo.launch.py: x=y=yaw=0).
    #   Xe that: goc ban do = cho xe dung LUC BAT slam_toolbox khi ve ban do.
    #            Dat xe lai DUNG CHO VA DUNG HUONG do truoc khi chay. Khong duoc
    #            thi dung "2D Pose Estimate" trong RViz.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    navigators: ["navigate_to_pose", "navigate_through_poses"]

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
      
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      # Tran vat ly cua xe: MAX_WHEEL_RPM 120 voi banh ban kinh 0.03225 m
      #   120/60 * 2*pi * 0.03225 = 0.405 m/s
      # De 0.5 thi Nav2 lap ke hoach theo toc do xe khong dat duoc, va firmware
      # se cat bot -> xe luon chay cham hon du tinh. 0.35 chua trong tam voi.
      vx_max: 0.35
      vx_min: -0.2
      vy_max: 0.0    
      wz_max: 1.5    
      motion_model: "DiffDrive"
      visualize: true
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "TwirlingCritic"
      ]
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Diem xa tam nhat la goc ngoai banh sau (banh nho ra ngoai than xe):
      #   sqrt(0.046^2 + 0.113^2) = 0.122 m  -> lay 0.13 cho co bien.
      # Truoc day la 0.6, khop voi URDF cu mo ta mot chiec xe duong kinh 1 m.
      robot_radius: 0.13
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # robot_radius 0.13 + khoang an toan. Giu 0.75 cho xe 0.13 thi ca
        # phong 10x10 deu thanh vung cam va Nav2 khong tim duoc duong nao.
        inflation_radius: 0.25
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      # Diem xa tam nhat la goc ngoai banh sau (banh nho ra ngoai than xe):
      #   sqrt(0.046^2 + 0.113^2) = 0.122 m  -> lay 0.13 cho co bien.
      # Truoc day la 0.6, khop voi URDF cu mo ta mot chiec xe duong kinh 1 m.
      robot_radius: 0.13
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # robot_radius 0.13 + khoang an toan. Giu 0.75 cho xe 0.13 thi ca
        # phong 10x10 deu thanh vung cam va Nav2 khong tim duoc duong nao.
        inflation_radius: 0.25

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: map
    robot_base_frame: base_footprint

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins:
      - 'simple_charging_dock'
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
