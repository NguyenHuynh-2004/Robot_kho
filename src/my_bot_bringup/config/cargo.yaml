# Do kich thuoc hang (rong x cao) bang camera nhin thang + khoang cach tu LiDAR.
# Doc boi cargo_measure.py / cargo_task.py / tools/esp32_cam_node.py, va
# tools/sim_cargo.py (camera ao).
#
# Xe toi o lay hang (cot 5, quay Dong) -> LiDAR khop duong thang mat truoc hang
# (Z, goc lech) -> anh camera: tach hang khoi nen -> mep trai/phai/tren/duoi ->
# chieu tia qua tung mep len mat phang mat truoc hang -> rong, cao (m)
# -> bang phan loai -> xe chay ve o tra hang (hang 1, cot theo loai).

camera:
  # Mac dinh (mo phong + xe chua hieu chuan): ESP32-CAM OV2640 640x480, goc ngang
  # ~66 do. Xe that: tools/cam_calib.py agvN ghi so do vao camera_agvN.yaml
  # (cung thu muc) - file do DE LEN cac gia tri o day cho rieng xe do.
  width: 640
  height: 480
  fx: 492.8
  fy: 492.8
  cx: 320.0
  cy: 240.0
  dist: [-0.12, 0.02, 0.0, 0.0, 0.0]     # k1 k2 p1 p2 k3 (OpenCV)
  # Vi tri tam quang hoc so voi base_footprint (tam truc banh): truoc, trai, cao (m).
  # Camera nhin thang ra truoc, khong nghieng. Phai THAP hon mat tren hang thap
  # nhat - neu cao hon thi thay ca mat tren hop, mep tren anh khong con la mep
  # mat truoc.
  x: 0.06
  y: 0.0
  z: 0.11

# ESP32-CAM tren xe that (tools/esp32_cam_node.py -> /agvN/camera/image_raw).
# Firmware CameraWebServer CO SAN tren camera (khong nap lai), 320x240 (2026-10-14).
# url .../capture: chup tung anh `rate` lan/s - ~30 KB/s moi xe (do 2026-10-14).
# url ...:81/stream: luong MJPEG, camera day 23-25 anh/s ~280 KB/s moi xe - ton Wi-Fi
# chung voi micro-ROS cua LiDAR, chi dung khi /capture khong chay.
# camera_agvN.yaml (tools/cam_calib.py) nen hieu chuan DUNG do phan giai nay.
cameras:
  # IP CHEO so voi so xe (camera co san cua nguoi dung): xe 1 = .201, xe 2 = .200
  agv1: {url: "http://192.168.1.201/capture", rate: 3.0, rotate: 0}
  agv2: {url: "http://192.168.1.200/capture", rate: 3.0, rotate: 0}

lidar:
  # LiDAR so voi base_footprint (truoc, cao). Xe that: doc tu TF (URDF 0.014);
  # xe ao: 0.0. So nay chi dung khi chua co TF.
  x: 0.014
  z: 0.075
  half_fov_deg: 35        # chi xet tia trong +-35 do phia truoc
  max_range: 0.9          # m - xa hon la nen, khong phai hang
  scans: 10               # so vong quet lay trung binh

place:
  # O LAY hang: (hang r, cot pickup_col), r trong pickup_rows; xe quay pickup_heading
  # (d Dong / t Tay / b Bac / n Nam), hang dat phia do, mat truoc cach tam o gap m.
  # gap < 0.25 m thi costmap chan luon o lay hang (node_clearance).
  # (1,5) bi bo tren ban do that (sat vat can) -> chi hang 2-5.
  pickup_col: 5
  pickup_rows: [2, 3, 4, 5]
  pickup_heading: d
  gap: 0.35
  # O TRA hang: hang deliver_row, cot = classes[].col
  deliver_row: 1

# Gioi han do (gap 0.35, camera cach mat hang ~0.29 m): rong toi ~0.33 m, cao toi
# ~0.25 m (camera.z + 0.29 * 240 / fy) - hang cham mep anh thi bao loi, khong giao.
# Cao phai > camera.z (0.11) neu khong se thay mat tren (co canh bao).
# Bang phan loai: dong DAU TIEN khop thi chon cot do o hang tra. Don vi m.
# Sai so do ~2-3 mm: kich thuoc sat nguong (vd rong 12.0 cm voi max_w 0.12) co the
# roi sang loai ben canh.
# Hang 1 chi dung cot 1-4 (o (1,5) sat vat can tren ban do that).
classes:
  - {name: "nho",  max_w: 0.12, max_h: 0.15, col: 1}
  - {name: "vua",  max_w: 0.18, max_h: 0.15, col: 2}
  - {name: "cao",  max_w: 0.18, max_h: 0.30, col: 3}
  - {name: "rong", max_w: 0.33, max_h: 0.30, col: 4}
