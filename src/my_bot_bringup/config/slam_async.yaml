slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping #localization

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 5.0
    resolution: 0.05
    restamp_tf: false
    # Firmware chia 360 do thanh 320 bin, bin nao khong co diem thi de range =
    # 0.0. Do duoc tren xe that: 84/320 = 26% bin trong moi vong. Voi
    # min_laser_range = 0.0 thi cac gia tri 0.0 do van lot qua bo loc va
    # slam_toolbox phai tu doan y nghia cua chung. Dat 0.12 (tren range_min
    # 0.10 cua message) de loai han chung.
    min_laser_range: 0.12
    # X2/X2L thuc te chi toi ~8 m, va message cung khai range_max = 8.0.
    # De 20.0 thi khong tia nao cham nguong "khong co vat can" -> slam khong
    # biet duong nao la trong that su.
    max_laser_range: 8.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # Xe phai di duoc bay nhieu met (hoac quay bay nhieu rad) thi slam_toolbox
    # moi them MOT vong quet nua vao do thi. Mac dinh 0.5 la cho robot co lon
    # chay trong nha xuong; voi xe 18 cm trong mot can phong thi qua thua, va
    # no la nua con lai cua chuyen ban do day mang xam: it vi tri quan sat thi
    # it luot tia di qua moi o, nen o khong bao gio vuot min_pass_through.
    # 0.2 cho gap 2.5 lan so vong quet duoc dua vao.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true 
    loop_match_minimum_chain_size: 10           
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.35    
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1 

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5      
    angle_variance_penalty: 1.0    

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.349   
    coarse_angle_resolution: 0.0349        
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    # Karto.h UpdateCell(): o CHI duoc to - trang hay den deu vay - khi
    #     cellPassCnt > min_pass_through
    # khong thoa thi o giu nguyen Unknown (xam). Tuc day la nguong "bao nhieu
    # lan tia phai di xuyen qua o thi moi dam ket luan gi ve no".
    #
    # Tung nang len 3 (= can >=4 luot) va do la sai: ban do day mang xam du
    # LiDAR nhin toi. Ly do la mat do tia giam theo khoang cach. 320 tia tren
    # 360 do = 0.0196 rad/tia, nen o khoang cach d hai tia lien nhau cach nhau
    # d*0.0196 m. Voi o luoi 0.05 m:
    #     d * 0.0196 > 0.05  ->  d > 2.55 m
    # Xa hon 2.55 m la hai tia lien nhau NHAY COC qua o o giua: mot vong quet
    # khong the cho mot o qua 1 luot, nhieu o khong duoc luot nao. Muon du 4
    # luot thi o do phai duoc nhin tu >=4 vi tri khac nhau.
    # Tra ve 2 (mac dinh cua Karto).
    min_pass_through: 2
    # DAY LA NUT THAT cua chuyen "ban do day cham den roi rac".
    # O duoc to den khi  so lan trung / so lan di qua  >  nguong nay. Voi 0.1,
    # chi can 1 tia rac tren 9 lan di qua sach la o do thanh vat can vinh vien.
    # Da do tren LiDAR nay: 6.2% so tia la diem co don (lech han ca hai tia ben
    # canh), tuc rac du nhieu de to den kha nhieu o o nguong 0.1.
    # 0.3 doi hoi 3 tren 10 lan phai trung moi to den -> vat that van hien,
    # rac bi loai. Tang nua neu van con cham; ha xuong neu vat can mong bi mat.
    occupancy_threshold: 0.3
