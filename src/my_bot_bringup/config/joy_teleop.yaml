# Lai xe bang tay cam - dung khi ve ban do (SLAM).
#
# CHI SO TRUC/NUT KHAC NHAU GIUA CAC TAY CAM. Truoc khi tin bo so duoi day,
# chay kiem tra thuc te:
#     ros2 topic echo /joy
# roi day tung can va bam tung nut, xem vi tri nao trong mang axes/buttons
# thay doi. Sua lai cac chi so ben duoi cho khop.
#
# Bo so nay theo kieu Xbox qua SDL2:
#     axes[0] = can trai ngang    axes[1] = can trai doc
#     buttons[4] = LB             buttons[5] = RB

joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.10          # bo qua do rung cua can quanh vi tri giua
    autorepeat_rate: 20.0   # phat lai /joy 20 Hz du khong dong gi ->
                            # firmware co CMD_VEL_TIMEOUT_MS 500ms, khong
                            # co dong nay xe se tu dung khi ban giu can im
    coalesce_interval_ms: 20

teleop_twist_joy_node:
  ros__parameters:
    # Can trai: day len = tien, day ngang = re
    axis_linear:
      x: 1
    axis_angular:
      yaw: 0

    # Toc do binh thuong: chay cham de ban do min, it nhoe.
    # Gioi han cua xe la vx_max 0.5 m/s va wz_max 1.5 rad/s (navigation.yaml),
    # nen turbo dat dung tran do.
    scale_linear:
      x: 0.25
    # Toc do quay tang theo yeu cau: 0.8 -> 1.2, turbo 1.5 -> 2.0 rad/s.
    # Tran vat ly la 2*v_max/wheel_separation = 2*0.405/0.200 = 4.05 rad/s,
    # nen con xa moi cham tran.
    #
    # DANH DOI khi VE BAN DO: LiDAR quay 8.6 Hz nen moi vong quet mat 0.116 s,
    # va firmware khong bu chuyen dong trong vong quet do. Quay cang nhanh thi
    # anh quet cang bi nhoe:
    #     0.8 rad/s -> 5.3 do      1.2 rad/s -> 8.0 do     2.0 rad/s -> 13.3 do
    # Luc ve ban do nen quay cham (dung turbo); turbo de danh cho luc di chuyen
    # xe sang cho khac.
    scale_angular:
      yaw: 1.2
    scale_linear_turbo:
      x: 0.5
    scale_angular_turbo:
      yaw: 2.0

    # Nut chet: phai GIU moi di duoc. Tha ra la xe dung.
    # Day la lop an toan quan trong khi lai xe that - can bi keo lech hay
    # tay cam roi xuong san se khong lam xe chay tiep.
    require_enable_button: true
    enable_button: 4          # LB
    enable_turbo_button: 5    # RB - giu THEM de chay nhanh

    # Firmware nhan geometry_msgs/Twist (khong phai TwistStamped).
    # Dat tuong minh de khong phu thuoc gia tri mac dinh cua tung ban ROS.
    publish_stamped_twist: false
